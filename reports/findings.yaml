# MP263 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G231"          # your group id, e.g. "G042"
problem_id: "MP263"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "units_billed_in_gst_return"
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of locality whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "stock_lines"
    value: -1
    count: 33
  duplicate_rows:
    present: true
    count: 52
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "shop_type"
    true_levels: 3

tracking:
  experiment_name: "mp263_pharmacy_sales"
  best_run_id: "f0432815e3814d65b3f807eb88e8bf75"
